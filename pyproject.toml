[tool.ruff]
line-length = 100
target-version = "py310"

# Исключаем автогенерированные миграции Django
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "RUF"]
ignore = [
    "E203",      # конфликт с ruff format
    "RUF001",    # неоднозначные символы в строках — у нас русский текст
    "RUF003",    # неоднозначные символы в комментариях — то же
]

[tool.ruff.lint.per-file-ignores]
# permission_classes = [...] — стандарт DRF, RUF012 не применяем
"mycloud/views/*.py" = ["RUF012"]
# __all__ с осмысленными группами и комментариями, RUF022 не применяем
"mycloud/views/__init__.py" = ["RUF012", "RUF022"]
# COLORS = {...} — константа класса форматтера
"mycloud/rainbow_logger.py" = ["RUF012"]
# BASE_DIR в manage.py — стандартный код Django, N806 не применяем
"manage.py" = ["N806"]